<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Isla Zombi: MP5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Rubik:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a2530;--fg:#f4f1e6;--ac:#ffb11f;--red:#e5483a;--grn:#5ed67a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:"Trebuchet MS","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 3px #000}
.bar{width:150px;height:12px;background:#0007;border:2px solid #fff6;border-radius:3px;overflow:hidden;margin-bottom:6px}
#hp{height:100%;width:100%;background:var(--red)}
#ammo{font-size:22px;color:var(--ac)}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-weight:800;font-size:20px;text-shadow:0 2px 4px #000;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
#rl{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:64px;height:64px;border-radius:50%;border:3px solid var(--ac);background:#0008;color:var(--ac);font-weight:800;font-size:13px}
#ov{position:fixed;inset:0;background:#06161cee;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
#ov h1{font-size:40px;margin:0;color:var(--ac);letter-spacing:1px}
#ov p{margin:0;max-width:340px;line-height:1.45;color:#d6e4e6}
#go{margin-top:12px;padding:14px 34px;font-size:20px;font-weight:800;border:0;border-radius:6px;background:var(--ac);color:#241500}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
.bw{display:flex;align-items:center;gap:6px;font-size:13px}
#gear{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 120px);width:42px;height:42px;border-radius:50%;border:2px solid #fff6;background:#0008;color:#fff;font-size:22px;display:none;z-index:3;padding:0}
#gp{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#000a}#fd{height:100%;width:100%;background:#ffb11f}
#sw{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 274px);width:64px;height:64px;border-radius:50%;border:3px solid var(--ac);background:#0008;color:var(--ac);font-weight:800;font-size:13px}
@media (orientation:landscape){#sw{right:214px!important;bottom:calc(env(safe-area-inset-bottom,0px) + 24px)!important}}
html.rot #sw{right:214px!important;bottom:24px!important}

#menu{position:fixed;inset:0;z-index:5;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);background:radial-gradient(120% 90% at 78% 12%,#7a4a28 0%,#2c2a33 38%,#0a0c11 100%)}
#menu .moon{display:none;position:absolute;right:6%;top:5%;width:min(20vmin,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3ecff,#b9a6e6 60%,#7a64b8);box-shadow:0 0 60px 20px #8a5cff55}
#zart{position:absolute;background-size:100% 100%;background-position:center;aspect-ratio:1402/1122;transform-origin:50% 80%;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 58%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 50%,#000 58%,transparent 80%)}
@keyframes lookP{0%,8%{transform:translateX(-50%) perspective(800px) rotateY(0) rotateZ(0)}28%,40%{transform:translateX(-52%) perspective(800px) rotateY(-17deg) rotateZ(-1deg)}60%,72%{transform:translateX(-48%) perspective(800px) rotateY(17deg) rotateZ(1deg)}92%,100%{transform:translateX(-50%) perspective(800px) rotateY(0) rotateZ(0)}}
@keyframes lookL{0%,8%{transform:perspective(800px) rotateY(0) rotateZ(0)}28%,40%{transform:translateX(-2%) perspective(800px) rotateY(-17deg) rotateZ(-1deg)}60%,72%{transform:translateX(2%) perspective(800px) rotateY(17deg) rotateZ(1deg)}92%,100%{transform:perspective(800px) rotateY(0) rotateZ(0)}}
@keyframes breathe{0%,100%{background-size:100% 100%}50%{background-size:104% 104%}}
#snd{position:absolute;z-index:3;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:44px;height:44px;border-radius:50%;border:2px solid #ffffff66;background:#0008;color:#fff;font-size:20px}
.mc{position:relative;text-align:center;width:100%}
.mc h1{margin:0 0 10px;font-weight:400;line-height:.92}
.t1,.t2{display:block;font-family:"Rubik Wet Paint",Impact,sans-serif;font-size:clamp(34px,min(12vw,15vh),100px)}
.t1{color:#f1e9ff;text-shadow:0 0 20px #8a3cff,0 3px 0 #3b1a7a}
.t2{color:#a64dff;text-shadow:0 0 18px #7a2cff,0 3px 0 #2a0f5c}
#pname{display:block;box-sizing:border-box;width:min(70vw,300px);margin:0 auto;padding:9px 12px;border:2px solid #5b2bb0;border-radius:6px;background:#0d0618;color:#efe6ff;font:600 16px Rubik,system-ui,sans-serif;text-align:center}
#pname::placeholder{color:#8f78c4}
.mb{display:block;box-sizing:border-box;width:min(78vw,380px);margin:10px auto 0;padding:clamp(8px,2vh,14px) 10px;font:italic 800 clamp(18px,min(6vw,6.5vh),32px) Rubik,Impact,sans-serif;color:#efe6ff;background:#12081f;border:3px solid #9b4dff;border-radius:8px;box-shadow:0 0 18px #7a2cff88,inset 0 0 14px #5b2bb066;cursor:pointer}
.mb.sm{width:min(60vw,290px)}
.mb:active{transform:scale(.97)}
.tag{margin:12px 0 0;font-style:italic;letter-spacing:.3em;font-size:clamp(11px,3vw,15px);color:#b99cf0}
#md,#tp,#pf{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;background:#06020fee;padding:16px;box-sizing:border-box}
.pn{width:min(92vw,440px);max-height:90%;overflow:auto;box-sizing:border-box;padding:16px;border:3px solid #9b4dff;border-radius:10px;background:#0d0618;box-shadow:0 0 24px #7a2cff77}
.pn h2{margin:0 0 4px;font:italic 800 24px Rubik,sans-serif;color:#b45cff}
.pn small{display:block;margin-bottom:10px;color:#9d86d6}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 6px;border-bottom:1px solid #2a1650;font:600 17px Rubik,system-ui,sans-serif}
.row:first-of-type{background:#1c0d35;border-radius:6px}
.row b{color:#ffb11f}

#menu,html.rot #menu{justify-content:center!important;align-items:center!important;padding:0!important;background:#0b0420!important}
#stage{position:relative;flex:none;font-size:1px}
#art{position:absolute;inset:0;background-size:100% 100%;background-position:center}
.hz{position:absolute;margin:0;padding:0;border:0;background:transparent;border-radius:14px;-webkit-tap-highlight-color:transparent;cursor:pointer}
.hz:active{background:#ffffff26;box-shadow:0 0 18px 4px #c06cff88}
#stage .cv{position:absolute;top:2.98%;height:3.4%;display:flex;align-items:center;box-sizing:border-box;padding-left:calc(var(--u,1px)*.25);background:#010005;color:#fff;font:700 calc(var(--u,1px)*1.9) system-ui,'Segoe UI',sans-serif;pointer-events:none;white-space:nowrap;overflow:hidden}
#coinv{left:70.7%;width:4.78%}#gemv{left:79.9%;width:5%}
#pbtn{left:59.8%;top:44.1%;width:31.2%;height:8.7%}
#play{left:59.2%;top:55.3%;width:32.9%;height:10.8%}
#top{left:60.3%;top:68.5%;width:29.7%;height:8.8%}
#pnl{position:absolute;left:68%;top:45.4%;width:17%;height:6.3%;display:none;align-items:center;justify-content:center;background:#0a0522;color:#fff;font:italic 800 calc(var(--u,1px)*3) Rubik,Impact,sans-serif;pointer-events:none;overflow:hidden;white-space:nowrap;text-shadow:0 0 10px #b45cff}
@media (orientation:portrait){#menu{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 5vh)}#zart{left:50%;top:2%;height:36%;animation:lookP 11s ease-in-out infinite,breathe 4s ease-in-out infinite}}
@media (orientation:landscape){.mc{margin-left:26%;width:58%}#zart{left:-3%;bottom:0;height:80%;animation:lookL 11s ease-in-out infinite,breathe 4s ease-in-out infinite}}
@media (prefers-reduced-motion:reduce){#zart{animation:none!important}}
@media (max-height:420px){.mb{margin-top:6px}.tag{margin-top:6px}.mc h1{margin-bottom:6px}}

let MM=null,mmMute=false;const SP=60/92/4;
const MEL=[[0,62,6],[6,65,2],[8,69,4],[12,67,2],[14,65,2],[16,58,4],[20,62,4],[24,65,6],[30,62,2],[32,67,6],[38,65,2],[40,62,4],[44,58,2],[46,62,2],[48,57,4],[52,61,4],[56,64,4],[60,69,4]];
const ROOT=[38,34,31,33],mf=m=>440*Math.pow(2,(m-69)/12);
function mmSnare(t,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type='bandpass';f.frequency.value=1900;f.Q.value=.7;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);s.connect(f);f.connect(g);g.connect(MM.bus);s.start(t,Math.random()*.05,.12)}
function mmKick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(MM.bus);o.start(t);o.stop(t+.32)}
function mmNote(m,t,len,vol,type,cut){const d=len*SP,lp=AC.createBiquadFilter(),g=AC.createGain();lp.type='lowpass';lp.frequency.setValueAtTime(cut*.5,t);lp.frequency.linearRampToValueAtTime(cut,t+.06);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.setValueAtTime(vol,t+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t+d);lp.connect(g);g.connect(MM.bus);for(const dt of [-7,7]){const o=AC.createOscillator();o.type=type;o.frequency.value=mf(m);o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.05)}}
function mmStep(s,t){const b=s%16,bar=Math.floor(s/16);
if([0,3,6,8,11,14].includes(b))mmSnare(t,[0,8].includes(b)?.5:.22);if([4,12].includes(b))mmSnare(t,.6);if(b===2||b===10||b===15)mmSnare(t,.12);
if(b===0||b===8)mmKick(t,.9);if(b===12&&bar%2)mmKick(t,.6);
if(b===0)mmNote(ROOT[bar],t,16,.16,'sawtooth',320);if(b===0)mmNote(ROOT[bar]+12,t,16,.07,'triangle',500);
for(const n of MEL)if(n[0]===s)mmNote(n[1],t,n[2],.075,'sawtooth',1700)}
function mmTick(){if(!MM||!AC)return;while(MM.next<AC.currentTime+.35){mmStep(MM.step%64,MM.next);MM.next+=SP;MM.step++}}
function mmStart(){if(MM||mmMute||started)return;initAudio();if(!AC)return;try{if(AC.state==='suspended')AC.resume();const bus=AC.createGain();bus.gain.value=.55;bus.connect(AC.destination);MM={bus,next:AC.currentTime+.1,step:0,id:setInterval(mmTick,80)}}catch(e){MM=null}}
function mmStop(){if(!MM)return;clearInterval(MM.id);const b=MM.bus;try{const n=AC.currentTime;b.gain.setValueAtTime(b.gain.value,n);b.gain.linearRampToValueAtTime(0,n+.35)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},500);MM=null}

function setGems(n){LSset('iz_gems',String(Math.max(0,n|0)))}
function setCoins(n){LSset('iz_coins',String(Math.max(0,n|0)))}
function owned(){try{const a=JSON.parse(LS('iz_owned')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function loadSkin(){const id=LS('iz_skin');SKIN=(owned().includes(id)&&SKINS.find(s=>s.id===id))||DEFSKIN}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function leftToday(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n}
function offState(){let o=null;try{o=JSON.parse(LS('iz_offers')||'null')}catch(e){}return(o&&o.d===dayKey()&&Array.isArray(o.done))?o:{d:dayKey(),done:[]}}
function offers(){const di=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),sk=SKINS[di%SKINS.length],sp=Math.round(sk.pr*.7);
return[{id:'o1',n:'Pack de monedas',ic:'coins',tag:'+300',cost:{gems:40},was:{gems:60},give:{coins:300}},

{id:'o3',n:sk.n,skin:sk,tag:'-30%',cost:{gems:sp},was:{gems:sk.pr},give:{skin:sk.id}}]}
const pz=(c,k)=>k==='gems'?IC.gem:IC.coin;
function shToast(t,err){const e=$('shtoast');e.textContent=t;e.className='on'+(err?' er':'');clearTimeout(shTo);shTo=setTimeout(()=>{e.className=err?'er':''},2000)}
function spend(c){if(c.gems&&gems()<c.gems){shToast('Te faltan '+(c.gems-gems())+' diamantes',1);return false}
if(c.coins&&coins()<c.coins){shToast('Te faltan '+(c.coins-coins())+' monedas',1);return false}
if(c.gems)setGems(gems()-c.gems);if(c.coins)setCoins(coins()-c.coins);return true}
function unlock(id){const o=owned();if(!o.includes(id)){o.push(id);LSset('iz_owned',JSON.stringify(o))}LSset('iz_skin',id);loadSkin()}
function grant(g){if(g.coins)setCoins(coins()+g.coins);if(g.gems)setGems(gems()+g.gems);if(g.skin)unlock(g.skin)}
function buySkin(id){const s=SKINS.find(x=>x.id===id);if(!s||owned().includes(id))return;if(!spend({gems:s.pr}))return;unlock(id);shToast('¡'+s.n+' desbloqueado y equipado!')}
function eqSkin(id){if(!owned().includes(id))return;LSset('iz_skin',id);loadSkin();shToast('Equipaste al '+SKINS.find(x=>x.id===id).n)}
function exch(kind,i){if(kind==='d'){const p=GEMPK[i];if(!spend({coins:p[1]}))return;setGems(gems()+p[0]);shToast('+'+p[0]+' diamantes')}
else{const p=COINPK[i];if(!spend({gems:p[1]}))return;setCoins(coins()+p[0]);shToast('+'+p[0]+' monedas')}}
function buyOffer(id){const st=offState(),o=offers().find(x=>x.id===id);if(!o||st.done.includes(id))return;if(o.give.skin&&owned().includes(o.give.skin))return;if(!spend(o.cost))return;grant(o.give);st.done.push(id);LSset('iz_offers',JSON.stringify(st));shToast('¡Oferta comprada!')}
function timeStr(){const t=Math.floor(leftToday()/1000),p=n=>String(n).padStart(2,'0');return p(Math.floor(t/3600))+':'+p(Math.floor(t%3600/60))+':'+p(t%60)}
function offersHtml(){const st=offState(),own=owned();
return'<div class="oh"><span>🔥</span><b>Ofertas Especiales</b><em><span>⏱</span><span id="shtm">'+timeStr()+'</span></em></div><div class="og">'+offers().map(o=>{
const done=st.done.includes(o.id)||(o.give.skin&&own.includes(o.give.skin));const k=o.cost.gems!=null?'gems':'coins';
const was=o.was[k];
return'<div class="oc'+(done?' dn':'')+'"><div class="oi'+(o.skin?' sk'+SKINS.indexOf(o.skin):'')+'">'+(o.ic?IC[o.ic]:'')+'</div><div class="ot"><b>'+o.n+'</b><div class="pr">'+(done?'<span>Adquirida</span>':pz(0,k)+'<span>'+o.cost[k]+'</span><s>'+was+'</s><i>'+o.tag+'</i>')+'</div></div>'+
(done?'<button class="bt d" disabled>✓</button>':'<button class="bt" data-a="off" data-v="'+o.id+'">Comprar</button>')+'</div>'}).join('')+'</div>'}
